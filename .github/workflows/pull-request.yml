# Pull request pipeline (ADR-0021). Must pass before merging to main; also reused by the main pipeline.
name: Pull request

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release tags for the contract script rule

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OrderPlatform.slnx

      # 1. Warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build OrderPlatform.slnx -c $CONFIGURATION --no-restore

      # 6. Dependency vulnerability scan (NuGet advisory database, including transitive packages).
      - name: Vulnerable packages
        run: |
          dotnet list OrderPlatform.slnx package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      # 2. Module unit tests: domain, application and fake-adapter levels of ADR-0022. No infrastructure needed.
      - name: Module unit tests
        run: |
          for project in tests/*.{Domain,Application,Infrastructure}.Tests; do
            if [ -d "$project" ]; then dotnet test --project "$project" -c $CONFIGURATION --no-build; fi
          done

      # 3. Architecture and migration safety rules (ADR-0015, ADR-0009). No Docker needed.
      - name: Architecture tests
        run: dotnet test --project tests/OrderPlatform.Architecture.Tests -c $CONFIGURATION --no-build

      - name: Migration safety tests
        run: |
          export MIGRATIONS_RELEASE_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          dotnet test --project tests/OrderPlatform.Migrations.Tests -c $CONFIGURATION --no-build

      # 4. Integration tests: Testcontainers PostgreSQL and Keycloak, schema built by the Migrator (ADR-0022).
      - name: Integration tests
        run: dotnet test --project tests/OrderPlatform.Api.IntegrationTests -c $CONFIGURATION --no-build

      - name: AppHost test
        run: dotnet test --project tests/OrderPlatform.AppHost.Tests -c $CONFIGURATION --no-build

  release-compatibility:
    name: Release compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # baseline release or merge base

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 5. Marten patch against the previous release (artifact + expand-only rules), upgrade path, previous Api on the new
      #    schema, OpenAPI breaking change check (ADR-0008, ADR-0009, ADR-0020).
      - name: Compare with the previous release
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          OUT: artifacts/release-compatibility
        run: bash .github/scripts/release-compatibility.sh

      - name: Publish OpenAPI document and Marten patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility
          path: artifacts/release-compatibility
          if-no-files-found: ignore

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 7. Builds both images (including Wolverine code generation) and starts the local stack (ADR-0013, ADR-0021).
      - name: Smoke test
        run: bash .github/scripts/compose-smoke.sh

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
